    activation: immediate
    activation_reason: "At the very first clock edge after releasing reset (reset_n = 1, cnt_en = 1), the reset branch evaluates true and clears the counter."
    propagation: none
    propagation_reason: "Register val_out is directly connected to module output, causing the value to remain pinned at 0 without multi-cycle latency."
    difficulty_note: "Easy: val_out consistently remaining 0 when reset_n = 1 points directly to the reset branch polarity check."

