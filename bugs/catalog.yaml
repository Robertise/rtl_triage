    original: |2
                  if (do_push) begin
                      mem[wr_ptr] <= data_in;
                      wr_ptr      <= wr_ptr + 1'b1;
                  end
    mutated: |2
                  if (do_push) begin
                      mem[wr_ptr] = data_in;
                      wr_ptr      <= wr_ptr + 1'b1;
                  end
    correct_fix: |2
                  if (do_push) begin
                      mem[wr_ptr] <= data_in;
                      wr_ptr      <= wr_ptr + 1'b1;
                  end
    alternative_fixes: []
    expected_symptom: "Khi FIFO đang đầy (wr_ptr == rd_ptr) và thực hiện đọc/ghi đồng thời (push_req = 1, pop_req = 1), data_out đọc ra giá trị data_in vừa mới ghi vào (0xEE) thay vì phần tử cũ nhất đang nằm tại rd_ptr (0xB2)."
    activation: late
    activation_reason: "Cần nạp đầy 8 phần tử vào FIFO để wr_ptr == rd_ptr rồi thực hiện đồng thời push_req = 1 và pop_req = 1 mới kích hoạt xung đột đọc-sau-ghi trong cùng chu kỳ."
    propagation: none
    propagation_reason: "Phép gán blocking ghi đè mem[wr_ptr] làm câu lệnh data_out <= mem[rd_ptr] trong cùng khối always chốt giá trị mới ngay ra cổng data_out tại cạnh clock đó."
    difficulty_note: "Mức khó: lỗi race condition tinh vi giữa cổng ghi và cổng đọc trong cùng một khối always chỉ kích hoạt tại điều kiện biên wr_ptr == rd_ptr."

