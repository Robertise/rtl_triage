# RTL Failure Triage Agent - Bug Catalog (Phase 3 - Step 1 / H3.1)
# Priority order: fifo_flag > fsm_invalid_transition > reset_polarity > blocking_nonblocking > bit_width_mismatch > missing_branch > off_by_one

bugs:
  - bug_id: B001
    split: test
    module: fifo
    file: rtl/fifo.v
    bug_type: fifo_flag
    label_reason: "Lỗi nằm trực tiếp ở biểu thức tính cờ trạng thái fifo_full của FIFO; theo quy tắc ưu tiên nhãn, fifo_flag đứng thứ 1 (cao nhất) nên được chọn thay vì off_by_one."
    line_start: 30
    line_end: 30
    original: |2
          assign fifo_empty = (item_count == {(ADDR_WIDTH+1){1'b0}});
          assign fifo_full  = (item_count == FIFO_DEPTH);
    mutated: |2
          assign fifo_empty = (item_count == {(ADDR_WIDTH+1){1'b0}});
          assign fifo_full  = (item_count == (FIFO_DEPTH - 1));
    correct_fix: |2
          assign fifo_empty = (item_count == {(ADDR_WIDTH+1){1'b0}});
          assign fifo_full  = (item_count == FIFO_DEPTH);
    alternative_fixes:
      - "assign fifo_full = (item_count >= FIFO_DEPTH);"
      - "assign fifo_full = item_count[ADDR_WIDTH];"
    expected_symptom: "Cờ fifo_full bật sớm lên 1 khi item_count mới đạt 7 (FIFO_DEPTH - 1), làm từ chối thao tác push phần tử thứ 8 và khiến item_count dừng ở 7 thay vì 8."
    activation: late
    activation_reason: "Cần thực hiện liên tiếp 7 chu kỳ push dữ liệu để thanh ghi item_count tăng lên chạm ngưỡng FIFO_DEPTH - 1 (7) thì biểu thức cờ fifo_full mới tính sai."
    propagation: none
    propagation_reason: "Tín hiệu đầu ra fifo_full là mạch tổ hợp trực tiếp từ item_count, nên đổi sang giá trị sai ngay trong cùng chu kỳ item_count đạt 7."
    difficulty_note: "Không quá dễ vì triệu chứng đầu tiên trong bài kiểm thử báo ở item_count (7 thay vì 8) tại chu kỳ thứ 8, đòi hỏi truy ngược từ điều kiện chặn do_push về công thức cờ fifo_full."

