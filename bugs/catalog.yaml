  - bug_id: B005
    split: dev
    module: fsm_controller
    file: rtl/fsm_controller.v
    bug_type: fsm_invalid_transition
    label_reason: "Condition priority order in S_MAIN_GREEN is inverted, causing FSM to transition immediately when a car is present while skipping the minimum hold time TICKS_GREEN; belongs to fsm_invalid_transition (priority #2)."
    line_start: 45
    line_end: 49
    original: |2
                      S_MAIN_GREEN: begin
                          if (timer_cnt < TICKS_GREEN - 1'b1) begin
                              timer_cnt <= timer_cnt + 1'b1;
                          end else if (car_present) begin
                              current_state <= S_MAIN_YELLOW;
                              timer_cnt     <= 4'd0;
                          end
                      end
    mutated: |2
                      S_MAIN_GREEN: begin
                          if (car_present) begin
                              current_state <= S_MAIN_YELLOW;
                              timer_cnt     <= 4'd0;
                          end else if (timer_cnt < TICKS_GREEN - 1'b1) begin
                              timer_cnt <= timer_cnt + 1'b1;
                          end
                      end
    correct_fix: |2
                      S_MAIN_GREEN: begin
                          if (timer_cnt < TICKS_GREEN - 1'b1) begin
                              timer_cnt <= timer_cnt + 1'b1;
                          end else if (car_present) begin
                              current_state <= S_MAIN_YELLOW;
                              timer_cnt     <= 4'd0;
                          end
                      end
    alternative_fixes:
      - "if (car_present && (timer_cnt == TICKS_GREEN - 1'b1)) in the first branch."
    expected_symptom: "When car_present == 1, FSM immediately transitions from S_MAIN_GREEN (0) to S_MAIN_YELLOW (1) on the very first clock edge instead of waiting for the full 6 TICKS_GREEN cycles."
    activation: immediate
    activation_reason: "In the initial state after reset (S_MAIN_GREEN, timer_cnt = 0), asserting car_present = 1 immediately activates the first branch of the if statement."
    propagation: none
    propagation_reason: "Outputs state_debug and main_signal are combinational decodings of current_state, immediately changing at clock edge 1."
    difficulty_note: "The if/else-if priority inversion mechanism is distinct from other bugs in the dataset, requiring careful inspection of sequential branches."

