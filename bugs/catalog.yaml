    expected_symptom: "Phép cộng không tràn (0x15 + 0x23 = 0x38) vẫn đúng, nhưng khi cộng tràn 8-bit (0xFF + 0x01) thì flag_carry luôn bằng 0 thay vì 1."
    activation: immediate
    activation_reason: "Mạch tổ hợp ALU kích hoạt lỗi ngay trong phép thử cộng hai toán hạng có tổng vượt quá 8 bit (src_a + src_b > 8'hFF)."
    propagation: none
