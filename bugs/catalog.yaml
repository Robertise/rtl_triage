                      {flag_carry, alu_res} = src_a + src_b;
                  end
    alternative_fixes:
      - "{flag_carry, alu_res} = {1'b0, src_a} + {1'b0, src_b};"
    expected_symptom: "Non-overflow addition (0x15 + 0x23 = 0x38) works correctly, but 8-bit overflow addition (0xFF + 0x01) leaves flag_carry consistently 0 instead of 1."
    activation: immediate
    activation_reason: "Requires addition (op_code = 3'b000) where inputs cause an 8-bit unsigned overflow (src_a + src_b >= 256)."
    propagation: none
    propagation_reason: "1-bit intermediate wire carry_wire discards MSB carry bit, forcing flag_carry output to 0."
    difficulty_note: "Moderate: standard additions pass; only overflow cases fail, requiring inspecting intermediate carry bit widths."

