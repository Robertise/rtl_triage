  - bug_id: B008
    split: test
    module: fifo
    file: rtl/fifo.v
    bug_type: blocking_nonblocking
    label_reason: "Dùng phép gán blocking (=) thay cho non-blocking (<=) khi ghi vào mảng mem trong khối always tuần tự; không thuộc 3 nhãn ưu tiên cao hơn nên nhận nhãn ưu tiên số 4 là blocking_nonblocking."
    line_start: 46
