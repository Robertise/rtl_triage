# RTL Failure Triage Agent - Bug Catalog (Phase 3 - Step 1 / H3.1)
# Priority order: fifo_flag > fsm_invalid_transition > reset_polarity > blocking_nonblocking > bit_width_mismatch > missing_branch > off_by_one

bugs:
  - bug_id: B001
    split: test
    module: fifo
    file: rtl/fifo.v
    bug_type: fifo_flag
    label_reason: "Bug directly lies in the calculation expression of FIFO status flag fifo_full; according to the label priority rules, fifo_flag ranks 1st (highest) and is chosen over off_by_one."
    line_start: 30
    line_end: 30
    original: |2
          assign fifo_empty = (item_count == {(ADDR_WIDTH+1){1'b0}});
          assign fifo_full  = (item_count == FIFO_DEPTH);
    mutated: |2
          assign fifo_empty = (item_count == {(ADDR_WIDTH+1){1'b0}});
          assign fifo_full  = (item_count == (FIFO_DEPTH - 1));
    correct_fix: |2
          assign fifo_empty = (item_count == {(ADDR_WIDTH+1){1'b0}});
          assign fifo_full  = (item_count == FIFO_DEPTH);
    alternative_fixes:
      - "assign fifo_full = (item_count >= FIFO_DEPTH);"
      - "assign fifo_full = item_count[ADDR_WIDTH];"
    expected_symptom: "Flag fifo_full asserts high early when item_count only reaches 7 (FIFO_DEPTH - 1), rejecting the 8th push operation and leaving item_count stuck at 7 instead of 8."
    activation: late
    activation_reason: "Requires 7 consecutive push cycles so that register item_count increments to reach threshold FIFO_DEPTH - 1 (7), causing the fifo_full flag expression to evaluate incorrectly."
    propagation: none
    propagation_reason: "Output signal fifo_full is combinational directly from item_count, immediately propagating the incorrect value within the same cycle item_count reaches 7."
    difficulty_note: "Moderate difficulty because the initial test failure reports on item_count (7 instead of 8) at cycle 8, requiring tracing back from the do_push gating condition to the fifo_full flag logic."

